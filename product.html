<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Product Detail - DealHub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
    <div class="container nav-content">
        <div class="logo">DealHub</div>

        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="#categories">Categories</a>
            <a href="#trending">Trending</a>
            <a href="blog.html">Blog</a>
            <a href="contact.html">Contact</a>
        </div>

        <div class="search-box">
            <form id="searchForm" class="search-form" action="search.html" method="get">
                <input type="text" id="searchInput" name="q" placeholder="Search products..." autocomplete="off">
            </form>
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>

        <div class="hamburger" id="hamburger">
            <i class="fas fa-bars"></i>
        </div>
    </div>
</nav>

<main style="padding-top:110px;">
    <div class="container">
        <div id="productDetail" class="product-detail"></div>
    </div>
</main>

<footer class="footer" style="margin-top:60px;">
    <div class="container">
        <div style="color:#fff;padding:30px 0;">© 2026 DealHub</div>
    </div>
</footer>

<script src="products.js"></script>
<script src="script.js"></script>
<script>
    function queryParam(name){
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }

    const id = Number(queryParam('id'));
    const p = (window.products||[]).find(x=>x.id===id);
    const container = document.getElementById('productDetail');

    if(!p){
        container.innerHTML = '<p>Product not found. <a href="index.html">Go back</a></p>';
    } else {
        const discount = p.oldPrice ? Math.round((1 - p.price/p.oldPrice) * 100) : 0;
        container.innerHTML = `
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;">
                <div>
                    <img src="${p.image||''}" alt="${p.title}" style="width:100%;border-radius:12px;box-shadow:0 10px 30px rgba(2,6,23,0.12);">
                </div>
                <div>
                    <h1 style="font-size:28px;margin-bottom:8px;">${p.title}</h1>
                    <p style="color:var(--muted);margin-bottom:16px;">${p.desc}</p>
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                        <div style="font-size:22px;font-weight:800;">$${p.price}</div>
                        <div style="text-decoration:line-through;color:#9ca3af;">$${p.oldPrice}</div>
                        <div style="background:linear-gradient(90deg,#fb923c,#f97316);color:#fff;padding:6px 10px;border-radius:10px;">-${discount}%</div>
                    </div>
                    <div style="margin-bottom:18px;color:#f59e0b;font-weight:700;">★ ${p.rating} / 5</div>
                    <div style="display:flex;gap:12px;">
                        <a href="${p.link}" class="btn-primary">Buy Now</a>
                        <a href="index.html" class="btn-ghost">Back</a>
                    </div>
                    <section style="margin-top:22px;">
                        <h3>Product Details</h3>
                        <ul>
                            <li>Brand: DealHub Picks</li>
                            <li>Availability: In stock</li>
                            <li>Warranty: 1 year</li>
                        </ul>
                    </section>
                </div>
            </div>

            <section style="margin-top:28px;">
                <h3>Why this product is useful</h3>
                <ul>
                    <li>Designed to solve common problems quickly and efficiently.</li>
                    <li>Reliable performance and good value for money.</li>
                    <li>Compact design makes it ideal for daily use and travel.</li>
                </ul>
            </section>

            <section style="margin-top:22px;">
                <h3>Specifications</h3>
                <ul>
                    <li>Model: ${p.model || 'N/A'}</li>
                    <li>Weight: ${p.weight || 'N/A'}</li>
                    <li>Dimensions: ${p.dimensions || 'N/A'}</li>
                    <li>Color: ${p.color || 'Various'}</li>
                </ul>
            </section>

            <section style="margin-top:22px;">
                <h3>Customer Reviews</h3>
                <div class="reviews">
                    <div class="review" style="margin-bottom:10px;"><strong>Alex</strong> — ★★★★☆<p style="margin:6px 0;color:var(--muted);">Great value for money, fast delivery and solid build.</p></div>
                    <div class="review" style="margin-bottom:10px;"><strong>Priya</strong> — ★★★★★<p style="margin:6px 0;color:var(--muted);">Exceeded expectations—highly recommend.</p></div>
                </div>
            </section>

            <section style="margin-top:22px;">
                <h3>Related Products</h3>
                <div id="relatedProducts" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;"></div>
            </section>
        `;

        // Populate related products dynamically
        const relatedContainer = document.getElementById('relatedProducts');
        const related = (window.products || []).filter(x => x.id !== p.id).slice(0,4);
        related.forEach(r => {
            const a = document.createElement('a');
            a.href = `product.html?id=${r.id}`;
            a.className = 'product-card';
            a.style.cssText = 'display:block;width:160px;text-decoration:none;color:inherit;padding:10px;';
            a.innerHTML = `
                <img src="${r.image||''}" alt="${r.title}" style="width:100%;height:100px;object-fit:cover;border-radius:8px;">
                <div style="font-weight:700;margin-top:8px;font-size:13px;">${r.title}</div>
                <div style="color:#9ca3af;font-size:13px;">$${r.price}</div>
            `;
            relatedContainer.appendChild(a);
        });
    }
</script>
</body>
</html>
